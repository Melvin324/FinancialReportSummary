version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: financial-report-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: financial_report
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres123
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: financial-report-api
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://+:8080
      - API_KEY=${API_KEY}
      - BASE_URL=${BASE_URL}
      - AiSummary__Model=${AI_MODEL}
      - ConnectionStrings__Postgres=Host=postgres;Port=5432;Database=financial_report;Username=postgres;Password=postgres123
    ports:
      - "5000:8080"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8080/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  pgdata:
    driver: local
